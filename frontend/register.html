<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Source+Serif+4:wght@600;700&display=swap" rel="stylesheet">
  <link href="https://cdnjs.cloudflare.com/ajax/libs/twitter-bootstrap/5.3.3/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdnjs.cloudflare.com/ajax/libs/bootstrap-icons/1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
  <title>Register — ABC College</title>
  <link href="css/style.css" rel="stylesheet">
</head>
<body data-page="login">
  <div id="navbar-placeholder"></div>
  <div class="auth-wrapper py-5">
    <div class="container">
      <div class="row justify-content-center">
        <div class="col-lg-8">
          <div class="auth-card shadow-sm p-4 p-lg-5">
            <h3 class="mb-1">Student Registration</h3>
            <p class="text-muted small mb-4">Create your ABC College event portal account.</p>
            <div class="alert alert-danger d-none" id="registerError"></div>
            <form id="registerForm">
              <div class="row g-3">
                <div class="col-md-6"><label class="form-label">Full Name</label><input type="text" id="name" class="form-control" required></div>
                <div class="col-md-6"><label class="form-label">Student ID</label><input type="text" id="studentId" class="form-control" required placeholder="ABC2024001"></div>
                <div class="col-md-6"><label class="form-label">Email</label><input type="email" id="email" class="form-control" required></div>
                <div class="col-md-6"><label class="form-label">Phone</label><input type="tel" id="phone" class="form-control" pattern="[0-9+ ]{7,15}"></div>
                <div class="col-md-6"><label class="form-label">Department</label><select id="department" class="form-select" required><option value="">Select department</option><option>Computer Science</option><option>Electronics</option><option>Mechanical</option><option>Civil</option><option>Business Administration</option></select></div>
                <div class="col-md-6"><label class="form-label">Year</label><select id="year" class="form-select" required><option value="">Select year</option><option value="1">1st Year</option><option value="2">2nd Year</option><option value="3">3rd Year</option><option value="4">4th Year</option></select></div>
                <div class="col-md-6"><label class="form-label">Password</label><input type="password" id="password" class="form-control" minlength="6" required></div>
                <div class="col-md-6"><label class="form-label">Confirm Password</label><input type="password" id="confirmPassword" class="form-control" minlength="6" required></div>
                <div class="col-12"><button type="submit" id="registerBtn" class="btn btn-brand-primary w-100">Create Account</button></div>
              </div>
            </form>
            <p class="text-center small text-muted mt-4 mb-0">Already registered? <a href="login.html">Login</a></p>
          </div>
        </div>
      </div>
    </div>
  </div>
  <div id="footer-placeholder"></div>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/twitter-bootstrap/5.3.3/js/bootstrap.bundle.min.js"></script>
  <script src="js/config.js"></script>
  <script src="js/main.js"></script>
  <script src="js/auth.js"></script>
</body>
</html>
