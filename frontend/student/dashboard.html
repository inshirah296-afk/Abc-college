<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Source+Serif+4:wght@600;700&display=swap" rel="stylesheet">
  <link href="https://cdnjs.cloudflare.com/ajax/libs/twitter-bootstrap/5.3.3/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdnjs.cloudflare.com/ajax/libs/bootstrap-icons/1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
  <title>Student Dashboard — ABC College</title>
  <link href="../css/style.css" rel="stylesheet">
</head>
<body data-student-page="dashboard">
  <div class="container-fluid">
    <div class="row">
      <div class="col-lg-2 p-0 d-none d-lg-block" id="sidebar-placeholder"></div>
      <div class="col-lg-10 p-0">
        <nav class="navbar bg-navy d-lg-none px-3"><span class="text-white fw-bold">ABC COLLEGE</span><a class="text-white small" href="../index.html">Website</a></nav>
        <main class="p-4 p-lg-5">
<h2>Welcome, <span id="studentWelcomeName" class="text-purple">Student</span></h2>
<div class="divider-accent"></div>
<div class="row g-3 mb-4">
  <div class="col-md-4"><div class="dashboard-card p-3 d-flex align-items-center gap-3"><div class="dash-icon-circle bg-purple"><i class="bi bi-calendar-check"></i></div><div><div class="h3 mb-0" id="dashStatRegistered">0</div><div class="small text-muted">Registered Events</div></div></div></div>
  <div class="col-md-4"><div class="dashboard-card p-3 d-flex align-items-center gap-3"><div class="dash-icon-circle bg-navy"><i class="bi bi-hourglass-split"></i></div><div><div class="h3 mb-0" id="dashStatUpcoming">0</div><div class="small text-muted">Upcoming</div></div></div></div>
  <div class="col-md-4"><div class="dashboard-card p-3 d-flex align-items-center gap-3"><div class="dash-icon-circle bg-maroon"><i class="bi bi-check2-all"></i></div><div><div class="h3 mb-0" id="dashStatCompleted">0</div><div class="small text-muted">Completed</div></div></div></div>
</div>
<div class="row g-4">
  <div class="col-lg-7">
    <div class="dashboard-card p-3 mb-4"><h5>Recent Registrations</h5><div id="dashRecentRegistrations"></div></div>
    <div class="dashboard-card p-3"><h5>Event Reminders</h5><ul class="list-group list-group-flush" id="dashReminders"></ul></div>
  </div>
  <div class="col-lg-5"><div class="dashboard-card p-3"><h5>Announcements</h5><div id="dashAnnouncements"></div></div></div>
</div>
        </main>
      </div>
    </div>
  </div>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/twitter-bootstrap/5.3.3/js/bootstrap.bundle.min.js"></script>
  <script src="../js/config.js"></script>
  <script src="../js/main.js"></script>
  
  <script src="../js/events.js"></script>
  <script src="../js/student.js"></script>
</body>
</html>
