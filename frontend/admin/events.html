<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Source+Serif+4:wght@600;700&display=swap" rel="stylesheet">
  <link href="https://cdnjs.cloudflare.com/ajax/libs/twitter-bootstrap/5.3.3/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdnjs.cloudflare.com/ajax/libs/bootstrap-icons/1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
  <title>Manage Events — ABC College</title>
  <link href="../css/style.css" rel="stylesheet">
</head>
<body data-admin-page="events">
  <div class="container-fluid">
    <div class="row">
      <div class="col-lg-2 p-0 d-none d-lg-block" id="sidebar-placeholder"></div>
      <div class="col-lg-10 p-0">
        <nav class="navbar bg-navy d-lg-none px-3"><span class="text-white fw-bold">ABC COLLEGE</span><a class="text-white small" href="../index.html">Website</a></nav>
        <main class="p-4 p-lg-5">
<div class="d-flex justify-content-between align-items-center"><h2>Manage Events</h2><button class="btn btn-brand-primary" id="addEventBtn"><i class="bi bi-plus-lg me-1"></i>New Event</button></div><div class="divider-accent"></div>
<div class="dashboard-card p-3"><div class="table-responsive"><table class="table align-middle mb-0">
<thead><tr><th>Title</th><th>Category</th><th>Date</th><th>Seats</th><th>Status</th><th></th></tr></thead><tbody id="eventsTableBody"></tbody></table></div></div>
<div class="modal fade" id="eventModal" tabindex="-1"><div class="modal-dialog modal-lg modal-dialog-scrollable"><div class="modal-content">
<form id="eventForm"><div class="modal-header"><h5 class="modal-title" id="eventModalTitle">Create Event</h5><button type="button" class="btn-close" data-bs-dismiss="modal"></button></div>
<div class="modal-body"><div class="row g-3">
<div class="col-md-8"><label class="form-label">Title</label><input id="evTitle" class="form-control" required></div>
<div class="col-md-4"><label class="form-label">Category</label><select id="evCategory" class="form-select" required></select></div>
<div class="col-12"><label class="form-label">Description</label><textarea id="evDescription" class="form-control" rows="3" required></textarea></div>
<div class="col-md-4"><label class="form-label">Date</label><input type="date" id="evDate" class="form-control" required></div>
<div class="col-md-4"><label class="form-label">Start Time</label><input type="time" id="evStartTime" class="form-control" required></div>
<div class="col-md-4"><label class="form-label">End Time</label><input type="time" id="evEndTime" class="form-control" required></div>
<div class="col-md-6"><label class="form-label">Venue</label><input id="evVenue" class="form-control" required></div>
<div class="col-md-6"><label class="form-label">Organizer</label><input id="evOrganizer" class="form-control" required></div>
<div class="col-md-4"><label class="form-label">Max Participants</label><input type="number" min="1" id="evMaxParticipants" class="form-control" required></div>
<div class="col-md-4"><label class="form-label">Registration Deadline</label><input type="date" id="evDeadline" class="form-control" required></div>
<div class="col-md-4"><label class="form-label">Status</label><select id="evStatus" class="form-select"><option>Upcoming</option><option>Registration Open</option><option>Registration Closed</option><option>Completed</option><option>Cancelled</option></select></div>
<div class="col-12"><label class="form-label">Rules</label><textarea id="evRules" class="form-control" rows="2"></textarea></div>
<div class="col-md-6"><label class="form-label">Contact</label><input id="evContact" class="form-control"></div>
<div class="col-md-6"><label class="form-label">Banner Image</label><input type="file" id="evImage" accept="image/*" class="form-control"></div>
</div></div><div class="modal-footer"><button type="button" class="btn btn-outline-navy" data-bs-dismiss="modal">Cancel</button><button type="submit" class="btn btn-brand-primary">Save Event</button></div></form></div></div></div>
        </main>
      </div>
    </div>
  </div>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/twitter-bootstrap/5.3.3/js/bootstrap.bundle.min.js"></script>
  <script src="../js/config.js"></script>
  <script src="../js/main.js"></script>
  
  <script src="../js/events.js"></script>
  <script src="../js/admin.js"></script>
</body>
</html>
