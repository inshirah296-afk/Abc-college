<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Source+Serif+4:wght@600;700&display=swap" rel="stylesheet">
  <link href="https://cdnjs.cloudflare.com/ajax/libs/twitter-bootstrap/5.3.3/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdnjs.cloudflare.com/ajax/libs/bootstrap-icons/1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
  <title>Announcements — ABC College</title>
  <link href="../css/style.css" rel="stylesheet">
</head>
<body data-admin-page="announcements">
  <div class="container-fluid">
    <div class="row">
      <div class="col-lg-2 p-0 d-none d-lg-block" id="sidebar-placeholder"></div>
      <div class="col-lg-10 p-0">
        <nav class="navbar bg-navy d-lg-none px-3"><span class="text-white fw-bold">ABC COLLEGE</span><a class="text-white small" href="../index.html">Website</a></nav>
        <main class="p-4 p-lg-5">
<h2>Announcements</h2><div class="divider-accent"></div>
<div class="row g-4"><div class="col-lg-5"><div class="dashboard-card p-3"><h5>New Announcement</h5>
<form id="announcementForm"><div class="mb-3"><label class="form-label">Title</label><input id="annTitle" class="form-control" required></div>
<div class="mb-3"><label class="form-label">Description</label><textarea id="annDescription" class="form-control" rows="3" required></textarea></div>
<div class="mb-3"><label class="form-label">Priority</label><select id="annPriority" class="form-select"><option>Normal</option><option>Important</option><option>Urgent</option></select></div>
<button class="btn btn-brand-primary">Post</button></form></div></div>
<div class="col-lg-7"><div id="announcementsList"></div></div></div>
        </main>
      </div>
    </div>
  </div>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/twitter-bootstrap/5.3.3/js/bootstrap.bundle.min.js"></script>
  <script src="../js/config.js"></script>
  <script src="../js/main.js"></script>
  
  <script src="../js/events.js"></script>
  <script src="../js/admin.js"></script>
</body>
</html>
