<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Source+Serif+4:wght@600;700&display=swap" rel="stylesheet">
  <link href="https://cdnjs.cloudflare.com/ajax/libs/twitter-bootstrap/5.3.3/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdnjs.cloudflare.com/ajax/libs/bootstrap-icons/1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
  <title>Admin Dashboard — ABC College</title>
  <link href="../css/style.css" rel="stylesheet">
</head>
<body data-admin-page="dashboard">
  <div class="container-fluid">
    <div class="row">
      <div class="col-lg-2 p-0 d-none d-lg-block" id="sidebar-placeholder"></div>
      <div class="col-lg-10 p-0">
        <nav class="navbar bg-navy d-lg-none px-3"><span class="text-white fw-bold">ABC COLLEGE</span><a class="text-white small" href="../index.html">Website</a></nav>
        <main class="p-4 p-lg-5">
<h2>Admin Dashboard</h2><div class="divider-accent"></div>
<div class="row g-3 mb-4">
  <div class="col-6 col-lg"><div class="stat-card"><div class="stat-number" id="adminStatStudents">0</div><div class="stat-label">Students</div></div></div>
  <div class="col-6 col-lg"><div class="stat-card"><div class="stat-number" id="adminStatEvents">0</div><div class="stat-label">Events</div></div></div>
  <div class="col-6 col-lg"><div class="stat-card"><div class="stat-number" id="adminStatUpcoming">0</div><div class="stat-label">Upcoming</div></div></div>
  <div class="col-6 col-lg"><div class="stat-card"><div class="stat-number" id="adminStatRegistrations">0</div><div class="stat-label">Registrations</div></div></div>
  <div class="col-6 col-lg"><div class="stat-card"><div class="stat-number" id="adminStatCompleted">0</div><div class="stat-label">Completed</div></div></div>
</div>
<div class="row g-4 mb-4">
  <div class="col-lg-6"><div class="dashboard-card p-3"><h5>Registrations by Category</h5><canvas id="chartByCategory" height="200"></canvas></div></div>
  <div class="col-lg-6"><div class="dashboard-card p-3"><h5>Monthly Registrations</h5><canvas id="chartMonthly" height="200"></canvas></div></div>
</div>
<div class="dashboard-card p-3"><h5>Recent Registrations</h5><div id="adminRecentRegistrations"></div></div>
        </main>
      </div>
    </div>
  </div>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/twitter-bootstrap/5.3.3/js/bootstrap.bundle.min.js"></script>
  <script src="../js/config.js"></script>
  <script src="../js/main.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>
  <script src="../js/events.js"></script>
  <script src="../js/admin.js"></script>
</body>
</html>
